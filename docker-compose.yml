# Local MongoDB for development: a single-node replica set, because placement
# updates run in a transaction and MongoDB only allows those on a replica set.
#
#   docker compose up -d
#   pnpm seed      # demo batch, companies and logins
#   pnpm dev
#
# with DB_CONNECTION_STRING=mongodb://localhost:27017/placemento?replicaSet=rs0&directConnection=true
# in server/.env. Set MONGO_PORT to publish on another host port if 27017 is taken.
services:
  mongo:
    image: mongo:9.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once this node is primary
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

volumes:
  mongo-data:
